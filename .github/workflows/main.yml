
name: Build Mushaf APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Free disk space
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo apt-get clean

          echo "Disk space after cleanup:"
          df -h

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      # 4. Setup Expo
      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # 5. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 6. Build APK locally
      - name: Build APK locally
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --output ./mushaf.apk \
            --non-interactive

      # 7. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-APK
          path: ./mushaf.apk
          if-no-files-found: error
          retention-days: 14

  publish-update:
    name: Publish Android OTA update
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update to preview channel
        env:
          UPDATE_MESSAGE: Automated update for commit ${{ github.sha }}
        run: eas update --channel preview --platform android --message "$UPDATE_MESSAGE" --non-interactive
