
name: Build Mushaf APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build APK locally
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --output ./mushaf.apk \
            --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mushaf-APK
          path: ./mushaf.apk
          if-no-files-found: error
          retention-days: 14
